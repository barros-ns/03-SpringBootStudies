spring.datasource.url="put url here"
spring.datasource.username="put username of database here"
spring.datasource.password="put the password here"

#turn off the spring boot banner
spring.main.banner-mode=off

#Reduce Logging level
logging.level.root=warn

#Add loggin configs to display SQL Statements
logging.level.org.hibernate.SQL = debug
logging.level.org.hibernate.orm.jdbc.bind = trace

# Configure JPA/Hibernate to auto Create the tables
spring.jpa.hibernate.ddl-auto=create